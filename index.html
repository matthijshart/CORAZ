<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finca El Corazón">
<meta name="theme-color" content="#FAF6F0">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Finca El Corazón">
<meta name="format-detection" content="telephone=yes">
<meta name="description" content="Welkomstboekje voor Finca El Corazón in Jávea, Spanje — restauranttips, stranden, huisinformatie en meer.">
<meta property="og:title" content="Finca El Corazón — Welkomstboekje">
<meta property="og:description" content="Welkomstboekje voor Finca El Corazón in Jávea, Spanje">
<meta property="og:type" content="website">
<meta property="og:locale" content="nl_NL">
<title>Finca El Corazón — Welkomstboekje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #FAF6F0;
  --card: #FFFFFF;
  --sand: #EDE6DA;
  --sand-dark: #D9CFBE;
  --terracotta: #C2855A;
  --terracotta-light: #E8C4A4;
  --terracotta-dark: #A06A3E;
  --olive: #8A9A6C;
  --olive-light: #C5D4A8;
  --sea: #6AACB0;
  --sea-light: #B0DDE0;
  --text: #2D2518;
  --text-mid: #5C4F3E;
  --text-light: #8A7E6D;
  --text-muted: #B0A794;
  --radius: 20px;
  --radius-sm: 14px;
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-body: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { height:100%; background:var(--bg); }
body {
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg);
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg);
}
/* ── HEADER ── */
.header {
  padding: 14px 20px 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  position: relative;
  z-index: 20;
  border-bottom: 1px solid transparent;
  transition: border-color .3s, box-shadow .3s;
  flex-shrink: 0;
}
.header.scrolled {
  border-bottom-color: var(--sand-dark);
  box-shadow: 0 4px 24px rgba(0,0,0,.04);
}
.header-logo {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 500;
  color: var(--terracotta-dark);
  letter-spacing: -.5px;
  font-style: italic;
}
.header-loc {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-weight: 500;
}
/* ── CONTENT AREA ── */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
.content::-webkit-scrollbar { display:none; }
.page { padding: 0 16px 120px; }
/* ── BOTTOM NAV ── */
.nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: rgba(250,246,240,.88);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border-top: 1px solid var(--sand-dark);
  padding-bottom: var(--safe-bottom);
}
.nav-scroll {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 8px 6px 6px;
  gap: 2px;
}
.nav-scroll::-webkit-scrollbar { display:none; }
.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 9px 4px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 12px;
  min-width: 54px;
  flex-shrink: 0;
  font-family: var(--font-body);
  transition: all .25s cubic-bezier(.4,0,.2,1);
}
.nav-btn:active { transform: scale(.93); }
.nav-btn.active { background: rgba(194,133,90,.13); }
.nav-icon { font-size: 21px; line-height: 1; }
.nav-label {
  font-size: 9.5px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  transition: color .25s;
}
.nav-btn.active .nav-label { color: var(--terracotta-dark); font-weight: 600; }
/* ── HERO ── */
.hero {
  margin: 8px -16px 20px;
  height: 380px;
  position: relative;
  overflow: hidden;
}
.hero-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(30,20,10,.65) 0%, rgba(30,20,10,.15) 50%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 32px 24px;
}
.hero h1 {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 400;
  font-style: italic;
  color: #fff;
  line-height: 1.15;
  text-shadow: 0 2px 12px rgba(0,0,0,.25);
  letter-spacing: -.5px;
}
.hero-sub {
  font-size: 14px;
  color: rgba(255,255,255,.85);
  margin-top: 8px;
  font-weight: 300;
  letter-spacing: .5px;
}
/* ── SECTION HEADERS ── */
.section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 0 18px;
  padding: 0 2px;
}
.section-emoji { font-size: 28px; }
.section-title {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -.5px;
  line-height: 1.1;
}
/* ── CARDS ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.02);
  border: 1px solid rgba(0,0,0,.04);
}
.card-warm {
  background: linear-gradient(135deg, #F5EDE2 0%, #EDE2D2 100%);
  border-color: var(--sand-dark);
}
.card-title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  color: var(--terracotta-dark);
  margin-bottom: 10px;
}
.body-text {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-mid);
  font-weight: 300;
}
.body-text + .body-text { margin-top: 10px; }
/* ── PHOTO GALLERY ── */
.photo-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.photo-row.single { grid-template-columns: 1fr; }
.photo-card {
  border-radius: var(--radius-sm);
  overflow: hidden;
  aspect-ratio: 4/3;
  position: relative;
}
.photo-card.tall { aspect-ratio: 3/4; }
.photo-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 24px 12px 10px;
  background: linear-gradient(to top, rgba(0,0,0,.5), transparent);
  font-size: 12px;
  color: rgba(255,255,255,.9);
  font-weight: 400;
  letter-spacing: .3px;
}
/* ── TIP CARD ── */
.tip-card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: #FDF8F0;
  border: 1px solid #EDD9BA;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.tip-emoji { font-size: 20px; flex-shrink:0; margin-top:1px; }
.tip-text { font-size: 13.5px; line-height:1.6; color:var(--text-mid); font-weight:300; }
.tip-text strong { font-weight:500; color:var(--text); }
/* ── TAB BAR (eten) ── */
.tab-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-bottom: 16px;
  padding: 2px 0;
}
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 8px 16px;
  border-radius: 24px;
  border: 1.5px solid var(--sand-dark);
  background: var(--card);
  font-size: 13px;
  font-weight: 400;
  color: var(--text-light);
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font-body);
  transition: all .25s;
}
.tab-btn:active { transform:scale(.95); }
.tab-btn.active {
  background: var(--terracotta);
  color: #fff;
  border-color: var(--terracotta);
  font-weight: 500;
}
.area-desc {
  font-size: 14px;
  color: var(--text-muted);
  padding: 0 2px;
  margin-bottom: 14px;
  font-style: italic;
  font-weight: 300;
}
/* ── RESTAURANT / PLACE CARDS ── */
.rest-card {
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.rest-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 2px;
  background: var(--sand-dark);
  transition: background .3s;
}
.rest-card.fav::before { background: var(--terracotta); }
.rest-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.rest-name {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -.2px;
}
.fav-badge {
  font-size: 10.5px;
  padding: 3px 10px;
  border-radius: 20px;
  background: linear-gradient(135deg, #FDF0E5, #F8E4CF);
  color: var(--terracotta-dark);
  font-weight: 500;
  letter-spacing: .2px;
}
.rest-desc {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text-light);
  font-weight: 300;
}
/* ── STRAND CARDS ── */
.strand-type {
  font-size: 10.5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 500;
}
.strand-type.zand { background: #F0E4C8; color: #7A6530; }
.strand-type.stenen { background: #E0DCDA; color: #5C5854; }
/* ── ITINERARY ── */
.itinerary {
  position: relative;
  padding-left: 22px;
  margin-top: 12px;
}
.itin-line {
  position: absolute;
  left: 16px;
  top: 24px;
  bottom: 24px;
  width: 2px;
  background: linear-gradient(to bottom, var(--terracotta-light), var(--sea-light));
  border-radius: 2px;
}
.itin-step {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 14px;
  position: relative;
}
.itin-dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--terracotta), var(--terracotta-dark));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
  z-index: 1;
  margin-top: 16px;
  box-shadow: 0 2px 8px rgba(194,133,90,.3);
}
/* ── DELIVERY ── */
.delivery-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
}
.delivery-icon { font-size: 30px; flex-shrink:0; }
/* ── NUMMERS ── */
.nummer-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  border-radius: var(--radius-sm);
  background: var(--card);
  border: 1px solid rgba(0,0,0,.04);
  text-decoration: none;
  color: inherit;
  transition: all .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.03);
}
.nummer-card:active { transform:scale(.97); background: var(--sand); }
.nummer-icon { font-size: 24px; flex-shrink:0; }
.nummer-info { flex:1; display:flex; flex-direction:column; }
.nummer-label { font-size: 14px; font-weight:500; color:var(--text); }
.nummer-sub { font-size: 11px; color:var(--text-muted); margin-top:1px; }
.nummer-tel {
  font-size: 13px;
  font-weight: 500;
  color: var(--sea);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* ── HOUSE RULES ── */
.house-rule {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 14px;
}
.house-rule:last-child { margin-bottom:0; }
.rule-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--sand);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.rule-text { font-size: 13.5px; line-height:1.6; color:var(--text-mid); font-weight:300; }
.rule-text strong { font-weight:500; color:var(--text); }
/* ── TOC GRID ── */
.toc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.toc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--sand);
  cursor: pointer;
  transition: all .2s;
}
.toc-item:active { transform:scale(.96); background:var(--sand-dark); }
.toc-icon { font-size: 18px; }
.toc-text { font-size: 13px; font-weight:500; color:var(--text-mid); }
/* ── DIVIDER ── */
.divider {
  height: 1px;
  background: var(--sand);
  margin: 20px 8px;
}
/* ── FOOTER CARD ── */
.footer-card {
  text-align: center;
  padding: 28px 24px;
  background: linear-gradient(135deg, #F5EDE2, #EDE2D2);
  border: 1px solid var(--sand-dark);
}
.footer-card .body-text { font-size:14px; }
.footer-heart {
  font-size: 28px;
  display: block;
  margin-bottom: 12px;
  opacity: .7;
}
/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to { opacity:1; transform:translateY(0); }
}
.fade-up { animation: fadeUp .5s cubic-bezier(.4,0,.2,1) both; }
.fade-up:nth-child(1) { animation-delay: 0s; }
.fade-up:nth-child(2) { animation-delay: .06s; }
.fade-up:nth-child(3) { animation-delay: .12s; }
.fade-up:nth-child(4) { animation-delay: .18s; }
.fade-up:nth-child(5) { animation-delay: .24s; }
.fade-up:nth-child(6) { animation-delay: .3s; }
.fade-up:nth-child(7) { animation-delay: .36s; }
.fade-up:nth-child(8) { animation-delay: .42s; }
.fade-up:nth-child(9) { animation-delay: .48s; }
/* ── DESKTOP ── */
@media (min-width: 481px) {
  #app {
    max-width: 480px;
    box-shadow: 0 0 60px rgba(0,0,0,.08);
    border-left: 1px solid var(--sand);
    border-right: 1px solid var(--sand);
  }
  body { background: #E8E0D4; }
}
/* ── MAP ── */
.eten-map {
  margin: 0 -16px 16px;
  height: 280px;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
  z-index: 1;
  position: relative;
}
.leaflet-popup-content-wrapper {
  border-radius: 12px !important;
  box-shadow: 0 4px 16px rgba(0,0,0,.12) !important;
  font-family: var(--font-body);
}
.leaflet-popup-content {
  margin: 10px 14px !important;
  line-height: 1.5 !important;
}
.popup-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}
.popup-desc {
  font-size: 12px;
  color: var(--text-light);
  font-weight: 300;
}
.popup-meta {
  font-size: 11px;
  color: var(--terracotta-dark);
  font-weight: 500;
  margin-top: 4px;
}
.rest-meta {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-muted);
}
.rest-meta span {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.rest-meta .rating {
  color: var(--terracotta);
  font-weight: 500;
}
.rest-link {
  display: inline-block;
  margin-top: 8px;
  font-size: 12px;
  color: var(--terracotta-dark);
  text-decoration: none;
  font-weight: 500;
  letter-spacing: .3px;
}
</style>
</head>
<body>
<div id="app">
  <header class="header" id="headerEl">
    <span class="header-logo">Finca El Corazón</span>
    <span class="header-loc">Jávea</span>
  </header>
  <div class="content" id="contentEl">
    <div class="page" id="pageEl"></div>
  </div>
  <nav class="nav">
    <div class="nav-scroll" id="navEl"></div>
  </nav>
</div>
<script>
// ── IMAGE DATA ──
const IMG = {
  hero: "1-IMG_0988.jpg",
  finca_front: "4-PHOTO-2025-05-22-09-41-58 8.jpg",
  pool: "6-PHOTO-2025-05-22-09-42-58 10.jpg",
  pool2: "8-PHOTO-2025-05-22-09-42-58 14.jpg",
  pool3: "10-PHOTO-2025-05-22-09-41-58 2.jpg",
  terrace: "5-PHOTO-2025-05-22-09-41-58 7.jpg",
  garden: "7-PHOTO-2025-05-22-09-41-58 3.jpg",
  patio: "9-PHOTO-2025-05-22-09-41-58 16 2.jpg",
  bedroom: "2-PHOTO-2025-05-22-09-42-58 9 2.jpg",
  bathroom: "3-PHOTO-2025-05-22-09-42-58 8 2.jpg",
};
// ── NAV SECTIONS ──
const SECTIONS = [
  { id:"welkom", icon:"🏡", label:"Welkom" },
  { id:"javea", icon:"🌊", label:"Jávea" },
  { id:"huis", icon:"🏠", label:"Het Huis" },
  { id:"eten", icon:"🍽️", label:"Eten" },
  { id:"stranden", icon:"🏖️", label:"Stranden" },
  { id:"denia", icon:"⛵", label:"Dénia" },
  { id:"bezorgen", icon:"🛵", label:"Bezorgen" },
  { id:"nummers", icon:"📞", label:"Nummers" },
];
let active = "welkom";
let etenTab = "arenal";
// ── RENDER NAV ──
function renderNav() {
  const nav = document.getElementById("navEl");
  nav.innerHTML = SECTIONS.map(s => `
    <button class="nav-btn ${s.id===active?'active':''}" onclick="navigate('${s.id}')">
      <span class="nav-icon">${s.icon}</span>
      <span class="nav-label">${s.label}</span>
    </button>
  `).join("");
}
function navigate(id) {
  active = id;
  if (id === "eten") etenTab = "arenal";
  renderNav();
  renderPage();
  document.getElementById("contentEl").scrollTo({top:0, behavior:"smooth"});
}
function setEtenTab(tab) {
  etenTab = tab;
  renderPage();
}
// ── SCROLL HEADER ──
document.getElementById("contentEl").addEventListener("scroll", function() {
  document.getElementById("headerEl").classList.toggle("scrolled", this.scrollTop > 40);
}, {passive:true});
// ── PAGES ──
function renderPage() {
  const el = document.getElementById("pageEl");
  const pages = { welkom, javea, huis, eten, stranden, denia, bezorgen, nummers };
  el.innerHTML = pages[active]();
}
function welkom() {
  return `
    <div class="hero fade-up">
      <img class="hero-img" src="${IMG.hero}" alt="Finca El Corazón">
      <div class="hero-overlay">
        <h1>Welkom bij<br>Finca El Corazón</h1>
        <p class="hero-sub">Jouw zomer in Jávea begint hier</p>
      </div>
    </div>
    <div class="card fade-up">
      <p class="body-text">Welkom! We hopen stiekem dat jullie Jávea nét zo leuk gaan vinden als wij. Het is een plek met veel gezichten: van levendige boulevards tot rustige hoekjes waar de luxe niet schreeuwt, maar zachtjes met je meewandelt.</p>
      <p class="body-text">Dit boekje helpt je op weg om onze favoriete plekken te ontdekken — en wie weet ontdek je er zelf nog een paar om voor jezelf te houden.</p>
    </div>
    <div class="photo-row fade-up">
      <div class="photo-card"><img src="${IMG.pool}" alt="Zwembad"><div class="photo-label">Zwembad</div></div>
      <div class="photo-card"><img src="${IMG.terrace}" alt="Terras"><div class="photo-label">Terras</div></div>
    </div>

function initEtenMap(list) {
  const el = document.getElementById("etenMap");
  if (!el) return;
  if (etenMap) { etenMap.remove(); etenMap = null; }
  etenMarkers = [];
  etenMap = L.map('etenMap', { scrollWheelZoom:false, zoomControl:true, attributionControl:false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom:18 }).addTo(etenMap);
  const bounds = [];
  list.forEach((r,i) => {
    if (!r.lat) return;
    const size = r.fav ? 14 : 10;
    const color = r.fav ? '#C2855A' : '#2D2518';
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:${size}px;height:${size}px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.25);"></div>`,
      iconSize:[size,size],
      iconAnchor:[size/2,size/2]
    });
    const marker = L.marker([r.lat,r.lng],{icon}).addTo(etenMap);
    marker.bindPopup(`
      <div class="popup-name">${r.fav?'❤️ ':''}${r.name}</div>
      <div class="popup-desc">${r.desc.substring(0,80)}${r.desc.length>80?'…':''}</div>
      ${r.rating?`<div class="popup-meta">★ ${r.rating} · ${r.reviews.toLocaleString()} reviews · ${r.price}</div>`
        :r.price?`<div class="popup-meta">${r.price}</div>`:''}
    `, {maxWidth:220});
    etenMarkers.push(marker);
    bounds.push([r.lat,r.lng]);
  });
  if (bounds.length) etenMap.fitBounds(bounds, {padding:[30,30]});
}
function focusMapMarker(i) {
  if (etenMarkers[i]) {
    const ll = etenMarkers[i].getLatLng();
    etenMap.setView(ll, 15, {animate:true});
    etenMarkers[i].openPopup();
    document.getElementById("contentEl").scrollTo({top:0,behavior:"smooth"});
  }
}
