<title>Finca El Corazón — Welkomstboekje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #FAF6F0;
  --card: #FFFFFF;
  --sand: #EDE6DA;
  --sand-dark: #D9CFBE;
  --terracotta: #C2855A;
  --terracotta-light: #E8C4A4;
  --terracotta-dark: #A06A3E;
  --olive: #8A9A6C;
  --olive-light: #C5D4A8;
  --sea: #6AACB0;
  --sea-light: #B0DDE0;
  --text: #2D2518;
  --text-mid: #5C4F3E;
  --text-light: #8A7E6D;
  --text-muted: #B0A794;
  --radius: 20px;
  --radius-sm: 14px;
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-body: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { height:100%; background:var(--bg); }
body {
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg);
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg);
}
/* ── HEADER ── */
.header {
  padding: 14px 20px 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  position: relative;
  z-index: 20;
  border-bottom: 1px solid transparent;
  transition: border-color .3s, box-shadow .3s;
  flex-shrink: 0;
}
.header.scrolled {
  border-bottom-color: var(--sand-dark);
  box-shadow: 0 4px 24px rgba(0,0,0,.04);
}
.header-logo {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 500;
  color: var(--terracotta-dark);
  letter-spacing: -.5px;
  font-style: italic;
}
.header-loc {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-weight: 500;
}
/* ── CONTENT AREA ── */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
.content::-webkit-scrollbar { display:none; }
.page { padding: 0 16px 120px; }
/* ── BOTTOM NAV ── */
.nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: rgba(250,246,240,.88);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border-top: 1px solid var(--sand-dark);
  padding-bottom: var(--safe-bottom);
}
.nav-scroll {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 8px 6px 6px;
  gap: 2px;
}
.nav-scroll::-webkit-scrollbar { display:none; }
.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 9px 4px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 12px;
  min-width: 54px;
  flex-shrink: 0;
  font-family: var(--font-body);
  transition: all .25s cubic-bezier(.4,0,.2,1);
}
.nav-btn:active { transform: scale(.93); }
.nav-btn.active { background: rgba(194,133,90,.13); }
.nav-icon { font-size: 21px; line-height: 1; }
.nav-label {
  font-size: 9.5px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  transition: color .25s;
}
.nav-btn.active .nav-label { color: var(--terracotta-dark); font-weight: 600; }
/* ── HERO ── */
.hero {
  margin: 8px -16px 20px;
  height: 380px;
  position: relative;
  overflow: hidden;
}
.hero-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(30,20,10,.65) 0%, rgba(30,20,10,.15) 50%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 32px 24px;
}
.hero h1 {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 400;
  font-style: italic;
  color: #fff;
  line-height: 1.15;
  text-shadow: 0 2px 12px rgba(0,0,0,.25);
  letter-spacing: -.5px;
}
.hero-sub {
  font-size: 14px;
  color: rgba(255,255,255,.85);
  margin-top: 8px;
  font-weight: 300;
  letter-spacing: .5px;
}
/* ── SECTION HEADERS ── */
.section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 0 18px;
  padding: 0 2px;
}
.section-emoji { font-size: 28px; }
.section-title {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -.5px;
  line-height: 1.1;
}
/* ── CARDS ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.02);
  border: 1px solid rgba(0,0,0,.04);
}
.card-warm {
  background: linear-gradient(135deg, #F5EDE2 0%, #EDE2D2 100%);
  border-color: var(--sand-dark);
}
.card-title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  color: var(--terracotta-dark);
  margin-bottom: 10px;
}
.body-text {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-mid);
  font-weight: 300;
}
.body-text + .body-text { margin-top: 10px; }
/* ── PHOTO GALLERY ── */
.photo-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.photo-row.single { grid-template-columns: 1fr; }
.photo-card {
  border-radius: var(--radius-sm);
  overflow: hidden;
  aspect-ratio: 4/3;
  position: relative;
}
.photo-card.tall { aspect-ratio: 3/4; }
.photo-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 24px 12px 10px;
  background: linear-gradient(to top, rgba(0,0,0,.5), transparent);
  font-size: 12px;
  color: rgba(255,255,255,.9);
  font-weight: 400;
  letter-spacing: .3px;
}
/* ── TIP CARD ── */
.tip-card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: #FDF8F0;
  border: 1px solid #EDD9BA;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.tip-emoji { font-size: 20px; flex-shrink:0; margin-top:1px; }
.tip-text { font-size: 13.5px; line-height:1.6; color:var(--text-mid); font-weight:300; }
.tip-text strong { font-weight:500; color:var(--text); }
/* ── TAB BAR (eten) ── */
.tab-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-bottom: 16px;
  padding: 2px 0;
}
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 8px 16px;
  border-radius: 24px;
  border: 1.5px solid var(--sand-dark);
  background: var(--card);
  font-size: 13px;
  font-weight: 400;
  color: var(--text-light);
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font-body);
  transition: all .25s;
}
.tab-btn:active { transform:scale(.95); }
.tab-btn.active {
  background: var(--terracotta);
  color: #fff;
  border-color: var(--terracotta);
  font-weight: 500;
}
.area-desc {
  font-size: 14px;
  color: var(--text-muted);
  padding: 0 2px;
  margin-bottom: 14px;
  font-style: italic;
  font-weight: 300;
}
/* ── RESTAURANT / PLACE CARDS ── */
.rest-card {
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.rest-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 2px;
  background: var(--sand-dark);
  transition: background .3s;
}
.rest-card.fav::before { background: var(--terracotta); }
.rest-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.rest-name {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -.2px;
}
.fav-badge {
  font-size: 10.5px;
  padding: 3px 10px;
  border-radius: 20px;
  background: linear-gradient(135deg, #FDF0E5, #F8E4CF);
  color: var(--terracotta-dark);
  font-weight: 500;
  letter-spacing: .2px;
}
.rest-desc {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text-light);
  font-weight: 300;
}
/* ── STRAND CARDS ── */
.strand-type {
  font-size: 10.5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 500;
}
.strand-type.zand { background: #F0E4C8; color: #7A6530; }
.strand-type.stenen { background: #E0DCDA; color: #5C5854; }
/* ── ITINERARY ── */
.itinerary {
  position: relative;
  padding-left: 22px;
  margin-top: 12px;
}
.itin-line {
  position: absolute;
  left: 16px;
  top: 24px;
  bottom: 24px;
  width: 2px;
  background: linear-gradient(to bottom, var(--terracotta-light), var(--sea-light));
  border-radius: 2px;
}
.itin-step {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 14px;
  position: relative;
}
.itin-dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--terracotta), var(--terracotta-dark));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
  z-index: 1;
  margin-top: 16px;
  box-shadow: 0 2px 8px rgba(194,133,90,.3);
}
/* ── DELIVERY ── */
.delivery-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
}
.delivery-icon { font-size: 30px; flex-shrink:0; }
/* ── NUMMERS ── */
.nummer-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  border-radius: var(--radius-sm);
  background: var(--card);
  border: 1px solid rgba(0,0,0,.04);
  text-decoration: none;
  color: inherit;
  transition: all .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.03);
}
.nummer-card:active { transform:scale(.97); background: var(--sand); }
.nummer-icon { font-size: 24px; flex-shrink:0; }
.nummer-info { flex:1; display:flex; flex-direction:column; }
.nummer-label { font-size: 14px; font-weight:500; color:var(--text); }
.nummer-sub { font-size: 11px; color:var(--text-muted); margin-top:1px; }
.nummer-tel {
  font-size: 13px;
  font-weight: 500;
  color: var(--sea);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* ── HOUSE RULES ── */
.house-rule {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 14px;
}
.house-rule:last-child { margin-bottom:0; }
.rule-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--sand);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.rule-text { font-size: 13.5px; line-height:1.6; color:var(--text-mid); font-weight:300; }
.rule-text strong { font-weight:500; color:var(--text); }
/* ── TOC GRID ── */
.toc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.toc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--sand);
  cursor: pointer;
  transition: all .2s;
}
.toc-item:active { transform:scale(.96); background:var(--sand-dark); }
.toc-icon { font-size: 18px; }
.toc-text { font-size: 13px; font-weight:500; color:var(--text-mid); }
/* ── DIVIDER ── */
.divider {
  height: 1px;
  background: var(--sand);
  margin: 20px 8px;
}
/* ── FOOTER CARD ── */
.footer-card {
  text-align: center;
  padding: 28px 24px;
  background: linear-gradient(135deg, #F5EDE2, #EDE2D2);
  border: 1px solid var(--sand-dark);
}
.footer-card .body-text { font-size:14px; }
.footer-heart {
  font-size: 28px;
  display: block;
  margin-bottom: 12px;
  opacity: .7;
}
/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to { opacity:1; transform:translateY(0); }
}
.fade-up { animation: fadeUp .5s cubic-bezier(.4,0,.2,1) both; }
.fade-up:nth-child(1) { animation-delay: 0s; }
.fade-up:nth-child(2) { animation-delay: .06s; }
.fade-up:nth-child(3) { animation-delay: .12s; }
.fade-up:nth-child(4) { animation-delay: .18s; }
.fade-up:nth-child(5) { animation-delay: .24s; }
.fade-up:nth-child(6) { animation-delay: .3s; }
.fade-up:nth-child(7) { animation-delay: .36s; }
.fade-up:nth-child(8) { animation-delay: .42s; }
.fade-up:nth-child(9) { animation-delay: .48s; }
/* ── DESKTOP ── */
@media (min-width: 481px) {
  #app {
    max-width: 480px;
    box-shadow: 0 0 60px rgba(0,0,0,.08);
    border-left: 1px solid var(--sand);
    border-right: 1px solid var(--sand);
  }
  body { background: #E8E0D4; }
}
</style>
</head>

// ── NAV SECTIONS ──
const SECTIONS = [
  { id:"welkom", icon:"🏡", label:"Welkom" },
  { id:"javea", icon:"🌊", label:"Jávea" },
  { id:"huis", icon:"🏠", label:"Het Huis" },
  { id:"eten", icon:"🍽️", label:"Eten" },
  { id:"stranden", icon:"🏖️", label:"Stranden" },
  { id:"denia", icon:"⛵", label:"Dénia" },
  { id:"bezorgen", icon:"🛵", label:"Bezorgen" },
  { id:"nummers", icon:"📞", label:"Nummers" },
];
let active = "welkom";
let etenTab = "arenal";
// ── RENDER NAV ──
function renderNav() {
  const nav = document.getElementById("navEl");
  nav.innerHTML = SECTIONS.map(s => `
    <button class="nav-btn ${s.id===active?'active':''}" onclick="navigate('${s.id}')">
      <span class="nav-icon">${s.icon}</span>
      <span class="nav-label">${s.label}</span>
    </button>
  `).join("");
}
function navigate(id) {
  active = id;
  if (id === "eten") etenTab = "arenal";
  renderNav();
  renderPage();
  document.getElementById("contentEl").scrollTo({top:0, behavior:"smooth"});
}
function setEtenTab(tab) {
  etenTab = tab;
  renderPage();
}
// ── SCROLL HEADER ──
document.getElementById("contentEl").addEventListener("scroll", function() {
  document.getElementById("headerEl").classList.toggle("scrolled", this.scrollTop > 40);
}, {passive:true});
// ── PAGES ──
function renderPage() {
  const el = document.getElementById("pageEl");
  const pages = { welkom, javea, huis, eten, stranden, denia, bezorgen, nummers };
  el.innerHTML = pages[active]();
}
function welkom() {
  return `
    <div class="hero fade-up">
      <img class="hero-img" src="${IMG.finca_front}" alt="Finca El Corazón">
      <div class="hero-overlay">
        <h1>Welkom bij<br>Finca El Corazón</h1>
        <p class="hero-sub">Jouw zomer in Jávea begint hier</p>
      </div>
    </div>
    <div class="card fade-up">
      <p class="body-text">Welkom! We hopen stiekem dat jullie Jávea nét zo leuk gaan vinden als wij. Het is een plek met veel gezichten: van levendige boulevards tot rustige hoekjes waar de luxe niet schreeuwt, maar zachtjes met je meewandelt.</p>
      <p class="body-text">Dit boekje helpt je op weg om onze favoriete plekken te ontdekken — en wie weet ontdek je er zelf nog een paar om voor jezelf te houden.</p>
    </div>
    <div class="photo-row fade-up">
      <div class="photo-card"><img src="${IMG.pool}" alt="Zwembad"><div class="photo-label">Zwembad</div></div>
      <div class="photo-card"><img src="${IMG.terrace}" alt="Terras"><div class="photo-label">Terras</div></div>
    </div>
    <div class="photo-row fade-up">
      <div class="photo-card"><img src="${IMG.dining}" alt="Eethoek"><div class="photo-label">Buiteneethoek</div></div>
      <div class="photo-card"><img src="${IMG.kitchen}" alt="Buitenkeuken"><div class="photo-label">Buitenkeuken</div></div>
    </div>
    <div class="card fade-up">
      <h3 class="card-title">Ontdek meer</h3>
      <div class="toc-grid">
        ${SECTIONS.filter(s=>s.id!=='welkom').map(s=>`
          <div class="toc-item" onclick="navigate('${s.id}')">
            <span class="toc-icon">${s.icon}</span>
            <span class="toc-text">${s.label}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}
function javea() {
  return `
    <div class="section-head fade-up">
      <span class="section-emoji">🌊</span>
      <h2 class="section-title">Ons beeld van Jávea</h2>
    </div>
    <div class="card fade-up">
      <p class="body-text">Jávea is een gezellig dorp met veel gezichten. Luxe schreeuwt hier niet, maar zit subtiel op de achtergrond. Drie plekken die je moet kennen:</p>
    </div>
    <div class="card fade-up">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="font-size:22px">🏖️</span>
        <h3 class="card-title" style="margin:0">El Arenal</h3>
      </div>
      <p class="body-text">De nieuwe, wat drukkere boulevard met leuke tentjes zoals La Bambula en Chabada, waar je zonder te reserveren heerlijk kunt lunchen en dineren. Gezellig om met kinderen over te lopen.</p>
    </div>
    <div class="card fade-up">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="font-size:22px">⚓</span>
        <h3 class="card-title" style="margin:0">Oude boulevard & haven</h3>
      </div>
      <p class="body-text">Rustiger dan El Arenal. Voor verse vis ga je naar A Bordo in de haven. Tussen de oude boulevard en El Arenal vind je ook La Siesta en Montgo di Bongo — perfect voor een middagdrankje.</p>
    </div>
    <div class="card fade-up">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="font-size:22px">🏘️</span>
        <h3 class="card-title" style="margin:0">Oude centrum</h3>
      </div>
      <p class="body-text">Dichtbij het huis en nog redelijk onontdekt — een must. Reserveer bij Temblor voor creatieve tapas of ga naar wijnbar La Trastienda voor heerlijke wijnen en hapjes.</p>

    <div class="tip-card fade-up">
      <span class="tip-emoji">💡</span>
      <p class="tip-text"><strong>Tip:</strong> La Trastienda — probeer de montadito met foie gras en de tonijn tataki. Piepklein buitenterras, altijd goed!</p>
    </div>

}
